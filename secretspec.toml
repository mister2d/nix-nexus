# SecretSpec — declares WHAT secrets this project needs, never their values.
# Safe to commit: there are no secrets in this file.
#
# Providers are pinned per secret rather than via a profile-wide default so the
# routing stays explicit. Read a value with:
#
#   secretspec run --reason "<why>" -- <command>
#
# --reason is mandatory: secretspec 0.13 enforces a require_reason policy and
# fails the read without it.
#
# Version constraints (measured against the pinned 0.13.0 binary, not assumed):
#   available providers    keyring, vault, dotenv, env
#   NOT available          sops, age, systemd-credential  (all 0.17+)
#   NOT available          [scopes]                       (0.17+)
# nixpkgs has no 0.17 build and cachix/secretspec publishes no flake, so these
# stay out of reach until nixpkgs catches up. See docs/secrets.md.

[project]
name = "nix-nexus"
revision = "1.0"

[providers]
# The system keyring. Present on sweet16 and petunia via gnome-keyring
# (modules/core/security.nix). Headless hosts have no Secret Service daemon and
# must use home_vault instead.
local = "keyring://"

# The fleet's existing Vault. VAULT_ADDR is already exported by
# modules/user/bash.nix; the kv-v2 mount matches the Matrix stack's usage.
# Secrets land at kv-v2/secretspec/{project}/{profile}/{key}, field `value`.
home_vault = "vault://vault.service.consul:8200/kv-v2"

[profiles.default]
# Credentials for the Claude Code Stop hook (.claude/hooks/langfuse_hook.py),
# wired in modules/flake/checks.nix.
#
# Deliberately NOT required: the hook is optional telemetry and degrades
# gracefully when the keys are absent. Marking them required would make
# `secretspec run` exit non-zero and skip the hook entirely on every turn for
# anyone who has not configured Langfuse.
#
# Deliberately keyring-only: this runs on every Stop. A provider list falling
# back to Vault would mean a network round-trip per turn whenever the keyring
# misses, which is most turns for an unconfigured user.
LANGFUSE_PUBLIC_KEY = { description = "Langfuse public key for Claude Code trace export", required = false, providers = [
  "local",
] }
LANGFUSE_SECRET_KEY = { description = "Langfuse secret key for Claude Code trace export", required = false, providers = [
  "local",
] }
LANGFUSE_BASE_URL = { description = "Langfuse base URL; the hook defaults to https://us.cloud.langfuse.com", required = false, providers = [
  "local",
] }
