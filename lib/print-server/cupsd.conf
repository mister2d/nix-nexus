# Scheduler configuration for the print-server image. No authentication
# anywhere. Any client may use the web UI and print. Administrative pages and
# operations are limited by source address to __ADMIN_SUBNET__ (and
# localhost); entrypoint.sh substitutes it from $ADMIN_SUBNET at start.

LogLevel warn
MaxLogSize 1m
ErrorPolicy stop-printer

Listen *:631
Listen /run/cups/cups.sock

# Clients reach the server by its Consul name (print-server.service.consul),
# and its LAN address changes per allocation. Accept any Host header.
ServerAlias *

Browsing Off
DefaultShared Yes
WebInterface Yes
DefaultAuthType None

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow 127.0.0.1
  Allow __ADMIN_SUBNET__
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow 127.0.0.1
  Allow __ADMIN_SUBNET__
</Location>

<Location /admin/log>
  Order allow,deny
  Allow 127.0.0.1
  Allow __ADMIN_SUBNET__
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  # Administrative and printer-operator operations: admin subnet only.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
    Deny all
    Allow 127.0.0.1
    Allow __ADMIN_SUBNET__
  </Limit>

  # Listed explicitly so cupsd does not warn about missing limits for these
  # operations; they are open like everything else.
  <Limit Validate-Job Cancel-My-Jobs Close-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
