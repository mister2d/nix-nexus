# File/directory/user/group configuration for the print-server CUPS scheduler.
# Modeled on nixpkgs nixos/modules/services/printing/cupsd.nix. @bindir@ and
# @docroot@ are substituted at build time (pkgs.replaceVars). Everything else
# is a literal container-runtime path, seeded by entrypoint.sh on every start.

SystemGroup root lpadmin

ServerBin @bindir@/lib/cups
DataDir @bindir@/share/cups
DocumentRoot @docroot@

ServerRoot /data/etc-cups
RequestRoot /data/spool
CacheDir /var/cache/cups
StateDir /run/cups
TempDir /data/spool/tmp

AccessLog stderr
ErrorLog stderr
PageLog stderr

# User and group used to run filters/backends/helper programs.
User cups
Group lp
